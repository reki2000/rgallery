title:
  ja: Piano Recital
  en: Piano Recital
summary:
  ja: MIDIから運指を自動生成し、音と指先、鍵盤がひとつの時間を刻む。クラシックやラグタイムなど全18曲を、複数のカメラで楽しむピアノ演奏デモ。
  en: Automatically generated fingering brings MIDI notes, fingers and keys into sync. Enjoy 18 pieces, including
    classical music and ragtime, with recorded grand-piano audio and multiple cameras.
technology:
- WebGL
- Web Audio
- MIDI
