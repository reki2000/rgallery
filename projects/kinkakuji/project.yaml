title:
  ja: 金閣寺
  en: Kinkaku-ji
summary:
  ja: 金箔の光、屋根の重なり、水面の反射。ブラウザの中で、金閣寺の建築をさまざまな視点から眺める3Dビューアー。高画質モードではレイトレーシングで反射と陰影を精細に描きます。
  en: A browser-based view of the Golden Pavilion. Explore its architecture, golden surfaces and reflections from
    six camera positions. High-quality mode uses ray tracing to refine reflections and shading.
technology:
- WebGL 2
- Three.js
- Ray tracing
